site_name: Radicale for Mere Mortals
site_description: A small CalDAV and CardDAV server that runs on your own machine. Keeping calendars and contacts as plain files in a folder, serving them to the calendar and contacts apps you already use, with users, passwords and sharing rules you control.
site_url: https://paulsullivan33-dev.github.io/radicale-for-mere-mortals/
